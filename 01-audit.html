<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 01 - Audit</title>
  </head>
  <body>
    <main>
      <form method="post" action="/creditcarddetails">
        <h1>Credit Card Information</h1>
        <div>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" />
        </div>
        <br />
        <div>
          <label for="address">Address:</label>
          <input type="text" id="address" name="address" />
        </div>
        <br />
        <div>
          <label for="city">City:</label>
          <input type="text" id="city" name="city" />
        </div>
        <br />
        <div>
          <label for="zip">Zip Code:</label>
          <input type="text" id="zip" name="zip" />
        </div>
        <br />
        <fieldset>
          <legend>Credit Card Type:</legend>
          <input type="radio" id="visa" name="card" value="visa" />
          <label for="visa">Visa</label>
          <input type="radio" id="mastercard" name="card" value="mastercard" />
          <label for="mastercard">Mastercard</label>
          <input type="radio" id="amex" name="card" value="amex" />
          <label for="amex">American Express</label>
        </fieldset>
        <br />
        <div>
          <label for="cc_number">Credit Card Number:</label>
          <input type="text" id="cc_number" name="cc_number" />
        </div>
        <br />
        <div>
          <label for="cvv">CVC:</label>
          <input type="text" id="cvv" name="cvv" />
        </div>
        <br />
        <div>
          <input type="button" value="Submit" />
        </div>
      </form>
    </main>
  </body>
</html>
