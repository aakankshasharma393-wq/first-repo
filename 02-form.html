<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body class="bg-light">
    <main class="container">
      <div class="row justify-content-center mt-4">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm p-3 p-md-4">
            <h1 class="text-center m-4 fs-2">Roth IRA Calculator</h1>
            <form>
              <div class="row mb-3 align-items-center">
                <div class="col-6">
                  <label for="balance" class="form-label mb-0">
                    Balance ($)
                  </label>
                </div>

                <div class="col-6">
                  <input type="number" class="form-control" id="balance" />
                </div>
              </div>

              <div class="row mb-3 align-items-center">
                <div class="col-6">
                  <label for="contribution" class="form-label mb-0">
                    Annual Contribution ($)
                  </label>
                </div>

                <div class="col-6">
                  <input type="number" class="form-control" id="contribution" />
                </div>
              </div>

              <fieldset class="row mb-3">
                <legend class="col-6 col-form-label">
                  Maximize contributions?
                </legend>

                <div class="col-6">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="maximize"
                      id="yes"
                      value="yes"
                    />

                    <label class="form-check-label" for="yes"> Yes </label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="maximize"
                      id="no"
                      value="no"
                    />
                    <label class="form-check-label" for="no"> No </label>
                  </div>
                </div>
              </fieldset>
              <div class="row mb-3 align-items-center">
                <div class="col-6">
                  <label for="return" class="form-label mb-0">
                    Expected return (%)
                  </label>
                </div>

                <div class="col-6">
                  <input type="number" class="form-control" id="return" />
                </div>
              </div>

              <div class="row mb-3 align-items-center">
                <div class="col-6">
                  <label for="currentAge" class="form-label mb-0">
                    Current age
                  </label>
                </div>

                <div class="col-6">
                  <input type="number" class="form-control" id="currentAge" />
                </div>
              </div>

              <div class="row mb-3 align-items-center">
                <div class="col-6">
                  <label for="retirementAge" class="form-label mb-0">
                    Retirement age
                  </label>
                </div>

                <div class="col-6">
                  <input
                    type="number"
                    class="form-control"
                    id="retirementAge"
                  />
                </div>
              </div>

              <div class="row mb-4 align-items-center">
                <div class="col-6">
                  <label for="taxRate" class="form-label mb-0">
                    Tax rate (%)
                  </label>
                </div>

                <div class="col-6">
                  <input type="number" class="form-control" id="taxRate" />
                </div>
              </div>

              <div class="row mb-4">
                <div class="col-6">
                  <button type="button" class="btn btn-primary w-100">
                    Calculate
                  </button>
                </div>

                <div class="col-6">
                  <button type="reset" class="btn btn-outline-secondary w-100">
                    Reset
                  </button>
                </div>
              </div>
            </form>

            <p class="text-secondary mb-1">
              This exercise is a simplified version of the Roth IRA Calculator
            </p>

            <a
              href="https://www.calculator.net/roth-ira-calculator.html"
              target="_blank"
              rel="noopener noreferrer"
            >
              Calculator.net
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
